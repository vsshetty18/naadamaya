# NAADAMAYA development environment.
# Start everything:   docker compose up --build
# Stop everything:    docker compose down
# Wipe all data:      docker compose down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naadamaya
      POSTGRES_PASSWORD: naadamaya
      POSTGRES_DB: naadamaya
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naadamaya -d naadamaya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    # Applies database migrations, then starts the API with auto-reload.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    env_file: .env
    # Runs the audio analysis jobs (Celery).
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - .:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
